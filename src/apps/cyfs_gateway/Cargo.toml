[package]
name = "cyfs_gateway"
version.workspace = true
edition = "2021"
authors = ["BuckyOS DAO","@waterflier","@lurenpluto","@wugren"]
build = "build.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
tokio = { version = "*", features = ["full", "tracing"] }
cyfs-gateway-app-lib = { path = "../../components/cyfs-gateway-app-lib" }
cyfs-gateway-modules = { path = "../../components/cyfs-gateway-modules" }

[dev-dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "brotli"] }
async-trait.workspace = true
bns-client = { path = "../../components/bns-client" }
buckyos-kit.workspace = true
bytes.workspace = true
cyfs-gateway-lib = { path = "../../components/cyfs-gateway-lib" }
cyfs-sn = { path = "../../components/cyfs-sn" }
hickory-resolver = { version = "0.24", features = ["tokio"] }
http.workspace = true
http-body-util.workspace = true
hyper = { version = "1.8", features = ["full"] }
hyper-util.workspace = true
kRPC.workspace = true
name-lib.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
tempfile.workspace = true
url.workspace = true
