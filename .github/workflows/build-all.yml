name: Build All CYFS Gateway Artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      enable_tests:
        description: 'Enable cargo tests during build'
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: ${{ matrix.arch }}
      enable_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tests }}

  upload-payloads:
    name: Upload component payloads to R2
    needs: [build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/main' && github.repository == 'buckyos/cyfs-gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    concurrency:
      group: payload-r2-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download component payloads
        uses: actions/download-artifact@v6
        with:
          pattern: cyfs-gateway-*
          merge-multiple: true
          path: ${{ runner.temp }}/payloads
      - name: Upload component payloads to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: 87e0bdf811b13ee87fd0bcec7a4fd1e7
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: buckyos-installer
          source-dir: ${{ runner.temp }}/payloads
          destination-dir: cyfs-gateway/
          keep-file-fresh: false
          output-file-url: false
