name: Build BNS Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AMD64 binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt install -y musl-tools g++ binutils
          sudo ln -sf "$(command -v g++)" /usr/local/bin/musl-g++
          sudo ln -sf "$(command -v ar)" /usr/local/bin/musl-ar
          sudo ln -sf "$(command -v ranlib)" /usr/local/bin/musl-ranlib
          sudo ln -sf /usr/local/bin/musl-g++ /usr/local/bin/x86_64-linux-musl-g++
          sudo ln -sf /usr/local/bin/musl-ar /usr/local/bin/x86_64-linux-musl-ar
          sudo ln -sf /usr/local/bin/musl-ranlib /usr/local/bin/x86_64-linux-musl-ranlib

      - name: Install BuckyOS devkit
        run: pip install "buckyos-devkit @ git+https://github.com/buckyos/buckyos-devkit.git"

      - name: Read project version
        id: project
        working-directory: ./src
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' bucky_project.yaml)"
          if [ -z "$version" ]; then
            echo "Unable to read version from bucky_project.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build BNS backend
        working-directory: ./src
        run: buckyos-build amd64 --skip-web --select bns_dv cyfs_gateway

      - name: Stage bns_dv artifact
        working-directory: ./src
        run: |
          install -d bns_dv-artifact
          install -m 0755 web3-gateway/bns_dv bns_dv-artifact/bns_dv
          install -m 0644 components/bns-server/start_bns_dv.ts bns_dv-artifact/start_bns_dv.ts

      - name: Upload bns_dv artifact
        uses: actions/upload-artifact@v4
        with:
          name: bns_dv-${{ steps.project.outputs.version }}-linux-amd64
          path: ./src/bns_dv-artifact/
          if-no-files-found: error

      - name: Upload cyfs-gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyfs-gateway-${{ steps.project.outputs.version }}-linux-amd64
          path: ./src/rootfs/bin/cyfs-gateway/cyfs_gateway
          if-no-files-found: error
