name: build Web3 Gateway
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - uses: Kaven-Universe/github-action-current-date-time@v1
          id: date
          with:
            format: 'YYYYMMDD'
        - name: short time
          id: short_time
          run: |
            val="${{ steps.date.outputs.time }}"
            echo "last6=${val: -6}" >> $GITHUB_OUTPUT
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            toolchain: stable
            targets: x86_64-unknown-linux-musl
        - name: Setup Needed Packages
          run: |
            sudo apt update
            sudo apt install -y musl-tools g++ binutils
            sudo ln -sf "$(command -v g++)" /usr/local/bin/musl-g++
            sudo ln -sf "$(command -v ar)" /usr/local/bin/musl-ar
            sudo ln -sf "$(command -v ranlib)" /usr/local/bin/musl-ranlib
            sudo ln -sf /usr/local/bin/musl-g++ /usr/local/bin/x86_64-linux-musl-g++
            sudo ln -sf /usr/local/bin/musl-ar /usr/local/bin/x86_64-linux-musl-ar
            sudo ln -sf /usr/local/bin/musl-ranlib /usr/local/bin/x86_64-linux-musl-ranlib
        - name: install buckyos devkit
          run: pip install "buckyos-devkit @ git+https://github.com/buckyos/buckyos-devkit.git"
        - name: Build
          working-directory: ./src
          run: buckyos-build --app=web3-gateway
        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: web3-gateway-build${{ steps.short_time.outputs.last6 }}
            path: ./src/web3-gateway
            if-no-files-found: error
