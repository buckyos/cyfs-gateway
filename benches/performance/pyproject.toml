[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyfs-gateway-performance"
version = "0.6.0"
description = "cyfs-gateway benchmark tooling for nginx comparison"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
cyfs-gateway-performance = "cyfs_gateway_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["cyfs_gateway_performance*"]
